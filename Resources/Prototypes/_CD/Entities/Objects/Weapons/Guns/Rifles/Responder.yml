- type: entity
  name: Responder
  parent: [BaseWeaponRifle, BaseSecurityContraband]
  id: WeaponRifleResponder
  description: |-
    A high quality and rare firearm used by almost anyone with enough money in KT-338.
    Made by a small subsidary of a non-NanoTressen company specalising in complicated firearms, localized within KT-338. Currently in field testing for more widespread adoption in Cosmatic Sectors ERT teams.
    Rumors that you can disassemble the firearm and create a clock are refuted by the company.
    Uses .30 rifle ammo.
  components:
  - type: Sprite
    sprite: _CD/Objects/Weapons/Guns/Rifles/Responder.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _CD/Objects/Weapons/Guns/Rifles/Responder.rsi
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -25 # -20 Default
    maxAngle: -45 # -30 Defualt
  - type: Gun
    minAngle: 26 # 21 Default
    maxAngle: 47 # 32 Default
    fireRate: 4
    burstFireRate: 6
    selectedMode: Burst
    availableModes:
      - FullAuto
      - Burst
      - SemiAuto
    shotsPerBurst: 3
    burstCooldown: 0.350
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 1250 #x2.5 times lecter
