- type: alertLevel
  abstract: true
  id: BaseDelta
  name: alert-level-delta
  instructions: alert-level-delta-instructions
  # selectable: false # CD: Comment these out
  # disableSelection: true
  forceEnableEmergencyLights: true
  shuttleTime: 600 # CD change from 1200 to 600
  sound:
    path: /Audio/_CD/Misc/delta_alt.ogg # CD change from delta to delta alt
    params:
      volume: -3

- type: alertLevel
  parent: BaseDelta
  id: DeltaNuke
  announcement: alert-level-delta-nuke-announcement
  sound:
    path: /Audio/Misc/delta.ogg
    params:
      volume: -3
  color: DarkRed
  emergencyLightColor: Orange

